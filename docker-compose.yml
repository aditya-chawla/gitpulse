# Local development. Secrets come from backend/.env (copy backend/.env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gitpulse
      POSTGRES_PASSWORD: gitpulse
      POSTGRES_DB: gitpulse
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres install
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse -d gitpulse"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Overrides the host-oriented value in .env with the in-network address.
      DATABASE_URL: postgres://gitpulse:gitpulse@db:5432/gitpulse?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://backend:8080 # Vite proxies /api to the backend container
      VITE_POLL: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # keep Linux node_modules out of the host folder
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
