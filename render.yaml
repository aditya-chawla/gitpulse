# Render Blueprint for gitpulse: one free Docker web service (API) and one
# free static site (frontend). The static site forwards /api/* to the API with
# a rewrite so the browser sees a single origin (first-party session cookie).
#
# Live hosts: API https://gitpulse-api-gcn3.onrender.com, site
# https://gitpulse-aeo3.onrender.com. If the API host ever changes, update the
# rewrite destination below. Values marked `sync: false` are entered in the
# dashboard (see README).
#
# Fallback if the rewrite can't proxy POSTs/cookies: deploy Dockerfile.combined
# as a single service instead (README → "Single-service fallback").

services:
  - type: web
    name: gitpulse-api
    runtime: docker
    plan: free
    region: singapore # pick the region closest to your Neon database
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy only after CI passes on main
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL # Neon *direct* (non-pooled) connection string, sslmode=require
        sync: false
      - key: GITHUB_CLIENT_ID # GitHub App client ID
        sync: false
      - key: GITHUB_CLIENT_SECRET # GitHub App client secret
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY # base64 of the app's .pem private key
        sync: false
      - key: OAUTH_REDIRECT_URL # https://<frontend host>/api/auth/callback
        sync: false
      - key: CORS_ALLOWED_ORIGINS # https://<frontend host>
        sync: false
      - key: ALLOWED_USERS
        value: harshit3011
      - key: SCAN_SECRET # copy this value into the GitHub Actions secret SCAN_SECRET
        generateValue: true
      - key: FRONTEND_URL # same origin as the API thanks to the rewrite
        value: /
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: LOG_LEVEL
        value: info
      # Optional, set in the dashboard when wanted (see README):
      #   GITHUB_WEBHOOK_SECRET  PR assistant webhooks (without it: 30-min catch-up only)
      #   MCP_TOKEN, MCP_ALLOW_WRITES  enable /mcp
      #   ANTHROPIC_API_KEY (+ LLM_*)  AI summaries; off and $0 without a key

  - type: web
    name: gitpulse
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL # empty: same origin via the rewrite below
        value: ""
    routes:
      # Order matters: API first, then the SPA fallback.
      - type: rewrite
        source: /api/*
        destination: https://gitpulse-api-gcn3.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
